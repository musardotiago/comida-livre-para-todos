name: Publicar no site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar-no-site
  cancel-in-progress: true

env:
  SITE_REPO: musardotiago/musardotiago.github.io
  SITE_BRANCH: main
  SITE_DIR: comida-livre-para-todos

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Código-fonte
        uses: actions/checkout@v4

      - name: 2. Baixar o repositório do site
        uses: actions/checkout@v4
        with:
          repository: musardotiago/musardotiago.github.io
          ref: main
          path: _site
          token: ${{ secrets.SITE_TOKEN }}

      - name: 3. Espelhar na pasta
        run: |
          rm -rf "_site/$SITE_DIR"
          mkdir -p "_site/$SITE_DIR"
          rsync -a --delete \
            --exclude='.git' --exclude='.github' --exclude='_site' \
            --exclude='README.md' --exclude='.gitignore' \
            ./ "_site/$SITE_DIR/"
          touch _site/.nojekyll

      - name: 4. Commit e push
        run: |
          cd _site
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Sem mudancas."; exit 0; fi
          git commit -m "Publica comida-livre-para-todos (${{ github.sha }})"
          git push origin "HEAD:$SITE_BRANCH"
